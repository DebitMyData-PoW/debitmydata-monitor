# Prometheus on the DebitMyData monitoring server (installed by install.sh; changes here are
# overwritten by the next install: edit the repository's copy).
# It keeps a year of figures. Its alert rules (debitmydata-rules.yml) are read by the chain watch,
# which sends them with its own alerts (email, Discord).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/debitmydata-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels: {server: monitor}

  # This server: CPU, memory, disks, network, and the chain watch's figures (textfile)
  - job_name: monitor
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels: {server: monitor}

  # The pool server, through the private WireGuard tunnel (pool-agent/install.sh on it). Its
  # address is in debitmydata-pool.json: empty until add-pool.sh lets the pool server in.
  - job_name: pool
    file_sd_configs:
      - files: [/etc/prometheus/debitmydata-pool.json]
