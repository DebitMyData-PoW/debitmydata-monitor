# The DebitMyData dashboards (config/grafana/dashboards/), in the "DebitMyData" folder. They are
# the repository's: changes made in Grafana are not kept (save a copy under another name).
apiVersion: 1
providers:
  - name: debitmydata
    folder: DebitMyData
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards/debitmydata
