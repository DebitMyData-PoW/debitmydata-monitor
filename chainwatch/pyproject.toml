[project]
name = "dmd-chainwatch"
version = "1.1.1"
description = "Watches the DebitMyData chain: block history, mining cost, volume, forks, hashrate, miners and the rich list, with alerts, notifications and the public stats files."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["psycopg[binary]>=3.1,<4", "cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dmd-chainwatch = "chainwatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
